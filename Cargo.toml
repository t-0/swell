[package]
name = "swell"
version = "1.0.3"
edition = "2024"
description = "A terminal WAV/MP3 audio editor"
license = "MIT"

[dependencies]
anyhow = "1"
ratatui = "0.30.2"
crossterm = "0.29"
cpal = "0.18.2"
symphonia = {version = "0.6.1", default-features = false, features = ["mp3", "wav", "pcm", "adpcm", "aiff", "flac", "isomp4", "aac", "alac"] }
mp3lame-encoder = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "1.2.2"

[profile.release]
opt-level = 3
debug = false
