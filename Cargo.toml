[package]
name = "swell"
version = "0.1.0"
edition = "2021"
description = "A terminal WAV/MP3 audio editor"
license = "MIT"

[dependencies]
anyhow = "1"
ratatui = "0.29"
crossterm = "0.28"
cpal = "0.15"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "adpcm", "aiff", "flac"] }
mp3lame-encoder = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 3
debug = false
